[package]
name = "deskcritter"
version = "0.1.0"
description = "Monigote compañero de escritorio"
authors = ["MarcosRehtanz"]
license = "MIT"
repository = "https://github.com/MarcosRehtanz/deskcritter"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "deskcritter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
sysinfo = "0.33"
xcap = "0.0.13"
arboard = "3"
base64 = "0.22"
image = "0.25"
walkdir = "2"
regex = "1"
glob = "0.3"
tokio = { version = "1", features = ["time", "process"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
